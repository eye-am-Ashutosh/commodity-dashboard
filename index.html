<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commodity Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#F7F9FA; --ink:#14202B; --ink2:#465462; --muted:#76838F;
  --line:#DCE2E7; --grid:#ECEFF2; --accent:#0F5FA6; --accent-ink:#FFFFFF; --accent-soft:#E3EEF8;
  --up:#1A7F46; --down:#BF3328; --up-bg:#E5F4EA; --down-bg:#FBE9E7;
  --copper:#B4552D; --lithium:#6B55C8; --wti:#2F6FB3; --brent:#C0800F;
  --s1:#16877F; --s2:#C23B72; --s3:#5E7F12; --s4:#8A5A2B; --s5:#4459B8; --s6:#A63FA6;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 16px rgba(20,32,43,.05);
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E141A; --surface:#161F28; --surface2:#1B2530; --ink:#E5EBF0; --ink2:#A7B4C0; --muted:#7D8B98;
  --line:#2A3642; --grid:#212C37; --accent:#4F95DD; --accent-ink:#0B1016; --accent-soft:#1A2B3C;
  --up:#4CC47E; --down:#F06A5E; --up-bg:#15301F; --down-bg:#3A1A18;
  --copper:#E0835A; --lithium:#A18FF2; --wti:#6FA8E8; --brent:#E6B04A;
  --s1:#3CC2B6; --s2:#F0709E; --s3:#A2C94A; --s4:#D09A62; --s5:#8196F0; --s6:#D883D8;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141A; --surface:#161F28; --surface2:#1B2530; --ink:#E5EBF0; --ink2:#A7B4C0; --muted:#7D8B98;
  --line:#2A3642; --grid:#212C37; --accent:#4F95DD; --accent-ink:#0B1016; --accent-soft:#1A2B3C;
  --up:#4CC47E; --down:#F06A5E; --up-bg:#15301F; --down-bg:#3A1A18;
  --copper:#E0835A; --lithium:#A18FF2; --wti:#6FA8E8; --brent:#E6B04A;
  --s1:#3CC2B6; --s2:#F0709E; --s3:#A2C94A; --s4:#D09A62; --s5:#8196F0; --s6:#D883D8;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px}
header.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
header.top p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.asof{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:start;position:relative;transition:border-color .15s}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c),var(--shadow)}
.tile .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.tile .nm i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.tile .unit{grid-column:1/-1;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tile .px{font-size:20px;font-weight:600;grid-column:1}
.tile .chg{font-size:12px;align-self:center}
.tile svg{grid-column:1/-1;width:100%;height:34px;display:block;margin-top:4px}

.pill{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;font-family:var(--mono);font-size:12px;font-weight:500;white-space:nowrap}
.pill.up{color:var(--up);background:var(--up-bg)}
.pill.down{color:var(--down);background:var(--down-bg)}
.pill.flat{color:var(--ink2);background:var(--surface2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:16px 18px 6px}
.panel-head h2{margin:0;font-size:20px;font-weight:800}
.panel-head .sub{color:var(--muted);font-size:12px}
.bigpx{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.bigpx .v{font-size:30px;font-weight:600;letter-spacing:-.02em}
.bigpx .u{color:var(--muted);font-size:12px}

.ranges{display:flex;flex-wrap:wrap;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px}
.ranges button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--ink2)}
.ranges button:hover{color:var(--ink)}
.ranges button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}

.stats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.stats div{padding:9px 14px;border-left:1px solid var(--line);min-width:0}
.stats div:first-child{border-left:0}
.stats dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
.stats dd{margin:2px 0 0;font-family:var(--mono);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd.up{color:var(--up)} .stats dd.down{color:var(--down)}
@media (max-width:900px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats div:nth-child(5){border-left:0}.stats div:nth-child(n+5){border-top:1px solid var(--line)}}

.chart-wrap{position:relative;padding:8px 6px 4px 14px}
.legend{display:flex;gap:16px;padding:10px 18px 0;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;border-radius:1px;background:var(--c)}
#chart{display:block;width:100%;touch-action:pan-y;user-select:none}
#chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.14);min-width:140px;z-index:2}
.tip b{display:block;font-weight:600;color:var(--ink2);font-size:11px;margin-bottom:3px}
.tip .row{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono)}
.tip .row span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-family:var(--display)}
.tip .row i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.note{margin:0;padding:4px 18px 14px;color:var(--muted);font-size:12px;max-width:95ch}

.tbl-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px 10px}
.tbl-head h3{margin:0;font-size:15px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}

.xl{overflow:auto;max-height:560px;border-top:1px solid var(--line)}
table.sheet{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
.sheet caption{caption-side:top;text-align:left;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:7px 12px}
.sheet th{position:sticky;top:0;background:var(--surface2);color:var(--ink);font-weight:700;font-size:11.5px;text-align:right;padding:6px 10px;border:1px solid var(--line);white-space:nowrap;z-index:1}
.sheet th:nth-child(-n+2){text-align:left}
.sheet td{border:1px solid var(--line);padding:4px 10px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet td:nth-child(-n+2){text-align:left}
.sheet td.sn{color:var(--muted);width:56px}
.sheet td.up{color:var(--up)} .sheet td.down{color:var(--down)} .sheet td.na{color:var(--muted)}
.sheet tbody tr:hover td{background:var(--accent-soft)}
.src{font-family:var(--display);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.src.manual{color:var(--accent);font-weight:700}
.rm{border:0;background:none;color:var(--muted);padding:0 0 0 6px;font-size:13px;line-height:1}
.rm:hover{color:var(--down)}

.drawer{border-top:1px solid var(--line);padding:14px 18px;display:grid;gap:10px;background:var(--surface2)}
.drawer label{font-size:12px;font-weight:600;color:var(--ink2);display:grid;gap:4px}
.drawer input,.drawer textarea{font:inherit;font-family:var(--mono);font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);width:100%}
.drawer textarea{min-height:130px;resize:vertical}
.drawer .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.drawer .row label{flex:1 1 160px}
.msg{font-size:12.5px;color:var(--ink2);margin:0}
.msg.err{color:var(--down)}
.foot{color:var(--muted);font-size:11.5px;text-align:center}
.drow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.drow div{display:grid;gap:1px}
.drow b{font-size:13px}
.drow span{font-size:12px;color:var(--ink2)}
.btn.danger{color:var(--down);border-color:var(--down)}
.btn.danger.solid{background:var(--down);color:var(--surface)}
.confirm{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 12px;border:1px solid var(--down);border-radius:8px;background:var(--down-bg);font-size:12.5px}
.tile .px.empty{font-family:var(--display);font-size:14px;font-weight:500;color:var(--muted);padding-block:6px 18px}
.sheet td.empty-row{text-align:center;font-family:var(--display);color:var(--ink2);padding:28px 10px;white-space:normal}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools{display:flex;gap:4px;align-items:center}
.ibtn{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--ink2)}
.ibtn:hover{color:var(--ink);border-color:var(--muted)}
.ibtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ibtn.txt{font-size:12px;font-weight:600;color:var(--accent)}
#chart{cursor:crosshair}
#nav{display:block;width:100%;margin-top:6px;touch-action:none;user-select:none}
.panel.present{position:fixed;inset:0;z-index:50;border-radius:0;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);border:0}
.panel.present .panel-head{padding-top:22px}
.panel.present .bigpx .v{font-size:40px}
body.noscroll{overflow:hidden}
.count{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.info{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:Georgia,serif;font-style:italic;font-size:12px;font-weight:700;color:var(--ink2);padding:0;line-height:1}
.info[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#mPop{flex-basis:100%;margin:0;font-size:12.5px;color:var(--ink2);max-width:120ch}
.hright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tile.add{border-style:dashed;background:transparent;display:grid;grid-template-columns:1fr;place-content:center;justify-items:center;gap:2px;min-height:112px;color:var(--accent);text-align:center}
.tile.add span{font-weight:700;font-size:14px}
.tile.add small{font-size:11.5px;color:var(--muted)}
.tile.add:hover{border-color:var(--accent);background:var(--accent-soft)}
.tile .nm{min-width:0}
.tile .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.dropping .wrap{outline:2px dashed var(--accent);outline-offset:6px;border-radius:12px}
.imp-tbl{overflow-x:auto;border-top:1px solid var(--line)}
.imp-tbl table.sheet{min-width:760px}
.imp-tbl td{font-family:var(--display);text-align:left!important;vertical-align:middle;padding:6px 10px}
.imp-tbl th{text-align:left!important}
.imp-tbl input[type=text],.imp-tbl select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;min-width:120px}
.imp-tbl input.u{min-width:90px}
.imp-tbl input:disabled,.imp-tbl select:disabled{background:var(--surface2);color:var(--muted)}
.imp-tbl .sh b{display:block;font-size:13px}.imp-tbl .sh span,.imp-tbl .rc span{display:block;font-size:11px;color:var(--muted)}
.imp-tbl .rc{font-family:var(--mono);white-space:nowrap}
.imp-tbl tr.off td{color:var(--muted)}
.imp-tbl .why{font-family:var(--display);font-size:12px;color:var(--muted)}
.imp-foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line)}
.imp-foot .msg{flex:1 1 200px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.method{display:grid;gap:8px;padding:10px 18px;border-top:1px solid var(--line);background:var(--surface2)}
.method .ctl{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.method .ctl > span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.method select{font:inherit;font-size:12.5px;font-weight:600;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
.method label{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.method p{margin:0;font-size:12.5px;color:var(--ink2);max-width:120ch}
.method p b{color:var(--ink);font-weight:600}
.formulas{display:grid;gap:3px;padding:0 18px 16px;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.formulas b{font-family:var(--display);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.sheet tbody tr[data-i]{cursor:pointer}
.sheet tbody tr[data-i]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sheet tbody tr[aria-expanded="true"] td{background:var(--accent-soft)}
.sheet td.ov{background:var(--surface2);font-weight:600}
.sheet td.ov i{font-style:normal;color:var(--accent);margin-left:4px;font-size:11px}
.sheet tr.detail td{text-align:left;white-space:normal;background:var(--surface2);padding:8px 12px}
.sheet tr.detail div{display:grid;gap:3px;font-size:11.5px;color:var(--ink2);justify-items:start}
.sheet tr.detail .btn{margin-top:6px;font-family:var(--display)}
.pct-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:600px){.pct-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:inline-flex!important;grid-auto-flow:column;align-items:center;gap:8px!important}
.check input{width:auto}
@media (max-width:520px){.method,.formulas{padding-inline:14px}header.top h1{font-size:20px}.bigpx .v{font-size:24px}.panel-head{padding:14px 14px 6px}.tbl-head,.drawer{padding-inline:14px}.note{padding-inline:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>Commodity Tracker</h1>
    <div class="hright"><span class="asof" id="asof"></span><button class="btn" id="bSaveFile" type="button" hidden title="Download a copy of this dashboard with all your data inside, ready to share">Save dashboard file</button><button class="btn primary" id="bImport" type="button">Import Excel</button></div>
  </header>

  <div class="tiles" id="tiles" role="group" aria-label="Sections"></div>
  <input type="file" id="fileIn" accept=".xlsx,.xlsm,.xls,.csv" multiple hidden>

  <section class="panel imp" id="imp" hidden aria-labelledby="impT">
    <div class="tbl-head"><h3 id="impT">Import from Excel</h3><div class="actions"><button class="btn" id="impMore" type="button">Add another file</button><button class="btn" id="impClose" type="button">Close</button></div></div>
    <div id="impBody"></div>
    <div class="imp-foot">
      <label class="check" id="impPctWrap" hidden><input id="impPct" type="checkbox" checked> Keep the Day / Week / Month / Year % values from the sheets</label>
      <p class="msg" id="impMsg"></p>
      <button class="btn primary" id="impGo" type="button" disabled>Import</button>
    </div>
  </section>

  <section class="panel" id="cpanel" aria-labelledby="ptitle">
    <div class="panel-head">
      <div>
        <h2 id="ptitle">—</h2>
        <div class="bigpx"><span class="v num" id="pbig">—</span><span id="pchg"></span><span class="u" id="punit"></span></div>
      </div>
      <div class="toolbar">
        <div class="ranges" id="ranges" role="group" aria-label="Time range"></div>
        <div class="tools" role="group" aria-label="Zoom">
          <button class="ibtn" id="zOut" type="button" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9" /></svg></button>
          <button class="ibtn" id="zIn" type="button" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9" /></svg></button>
          <button class="ibtn txt" id="zReset" type="button" hidden title="Back to the selected range">Reset</button>
          <button class="ibtn" id="zFull" type="button" title="Full screen" aria-label="Full screen" aria-pressed="false"></button>
        </div>
      </div>
    </div>
    <dl class="stats" id="stats"></dl>
    <div class="legend" id="legend" hidden></div>
    <div class="chart-wrap" id="cwrap">
      <svg id="chart" role="img" aria-label="Price chart"></svg>
      <div class="tip" id="tip" hidden></div>
      <svg id="nav" aria-label="Overview — drag to move or resize the zoom window"></svg>
    </div>
  </section>

  <section class="panel" aria-labelledby="ttitle">
    <div class="tbl-head">
      <h3><span id="ttitle">Price history</span> <span class="count" id="tcount"></span></h3>
      <div class="actions">
        <button class="btn" id="bSort" type="button">Newest first</button>
        <button class="btn" id="bAdd" type="button">Add entry</button>
        <button class="btn" id="bPaste" type="button">Paste from Excel</button>
        <button class="btn" id="bCopy" type="button">Copy for Excel</button>
        <button class="btn" id="bData" type="button">Manage data</button>
        <button class="btn primary" id="bCsv" type="button" hidden>Download CSV</button>
      </div>
    </div>
    <div class="method" aria-label="How % change is calculated">
      <div class="ctl">
        <span>% change</span>
        <div class="ranges" id="mMethod" role="group" aria-label="Method"><button type="button" data-m="calendar">Calendar</button><button type="button" data-m="sessions">Sessions</button></div>
        <label for="mFy">FY starts <select id="mFy"></select></label>
        <button class="info" id="mInfo" type="button" aria-expanded="false" aria-controls="mPop" title="How % change is calculated">i</button>
      <p id="mPop" hidden></p>
    </div>
    </div>
    <form class="drawer" id="fAdd" hidden>
      <div class="row">
        <label>Date<input id="addDate" type="date" required></label>
        <label><span id="addLbl">Price</span><input id="addPrice" type="text" inputmode="decimal" required placeholder="e.g. 133150"></label>
      </div>

/* ---------- storage: rows are kept per section per year in db "data/<key>__<year>" ---------- */
let chunkDocs = {};        // doc id -> {key, year, rows:{date:[price,day,week,month,year]}}
let legacy = {};           // older one-row-per-doc entries (db "entries"), still read
function rebuildManual(){
  const m={};
  for (const [k,byDate] of Object.entries(legacy)) for (const [d,v] of Object.entries(byDate)) (m[k]=m[k]||{})[d]=v;
  for (const c of Object.values(chunkDocs)){ if(!c||!c.key||!c.rows) continue;
    for (const [d,a] of Object.entries(c.rows)){ if(!Array.isArray(a)||!(a[0]>0)) continue; const ov={}; PCT.forEach((p,i)=>{ if(typeof a[i+1]==='number'&&isFinite(a[i+1])) ov[p]=a[i+1]; });
      (m[c.key]=m[c.key]||{})[d]={price:a[0],ov,id:`${c.key}|${d}`}; } }
  manual=m;
}
const yearOf = d => d.slice(0,4);
async function writeChunk(id,key,year,rows){
  if (Object.keys(rows).length){ chunkDocs[id]={key,year,rows}; await db.collection('data').doc(id).set({key,year:+year,rows}); }
  else { delete chunkDocs[id]; await db.collection('data').doc(id).delete(); }
}
async function saveRows(key,rows){
  if(!db){ manual[key]=manual[key]||{}; for(const r of rows) manual[key][r.d]={price:r.p,id:`${key}|${r.d}`,ov:r.ov||{}}; render(); return rows.length; }
  const byYear={}; for(const r of rows) (byYear[yearOf(r.d)]=byYear[yearOf(r.d)]||[]).push(r);
  for (const [y,rs] of Object.entries(byYear)){
    const id=`${key}__${y}`, cur={...((chunkDocs[id]||{}).rows||{})};
    for (const r of rs) cur[r.d]=[r.p, ...PCT.map(m=> r.ov&&r.ov[m]!=null ? r.ov[m] : null)];
    await writeChunk(id,key,y,cur);
  }
  rebuildManual(); render(); return rows.length;
}
async function removeEntry(key,d){
  if(!db){ if(manual[key]) delete manual[key][d]; render(); return; }
  const id=`${key}__${yearOf(d)}`;
  if (chunkDocs[id]&&chunkDocs[id].rows[d]){ const cur={...chunkDocs[id].rows}; delete cur[d]; await writeChunk(id,key,yearOf(d),cur); }
  const lg=legacy[key]&&legacy[key][d]; if(lg){ await db.collection('entries').doc(lg.lid).delete(); delete legacy[key][d]; }
  rebuildManual(); render();
}
async function deleteManual(keys){
  const n=manualIds(keys).length;
  if(!db){ for(const k of keys) delete manual[k]; return n; }
  for (const [id,c] of Object.entries(chunkDocs)) if(keys.includes(c.key)){ await db.collection('data').doc(id).delete(); delete chunkDocs[id]; }
  for (const k of keys){ for (const v of Object.values(legacy[k]||{})) await db.collection('entries').doc(v.lid).delete(); delete legacy[k]; }
  rebuildManual(); return n;
}

/* ---------- standalone file: state lives in this browser, and can be written into a new copy of the file ---------- */
function snapshotState(){
  const rows={}; for(const [k,byDate] of Object.entries(manual)){ rows[k]={}; for(const [d,v] of Object.entries(byDate)) rows[k][d]=[v.price,...PCT.map(m=>v.ov&&v.ov[m]!=null?v.ov[m]:null)]; }
  return {version:BAKED.version||0, sections:custom, rows, hideSeed, hiddenSections};
}
function applyState(s){
  custom=s.sections&&typeof s.sections==='object'?s.sections:{}; hideSeed=s.hideSeed||{}; hiddenSections=s.hiddenSections||{}; manual={};
  for(const [k,byDate] of Object.entries(s.rows||{})) for(const [d,a] of Object.entries(byDate||{})){ if(!Array.isArray(a)||!(a[0]>0)) continue;
    const ov={}; PCT.forEach((m,i)=>{ if(typeof a[i+1]==='number'&&isFinite(a[i+1])) ov[m]=a[i+1]; }); (manual[k]=manual[k]||{})[d]={price:a[0],ov,id:`${k}|${d}`}; }
}
function saveLocal(){ if(!STANDALONE) return; try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(snapshotState())); }catch(e){} }
function blobSave(name,data,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
function saveDashboardFile(){
  const s=snapshotState(); s.version=Date.now(); BAKED.version=s.version;
  const json=JSON.stringify(s).replace(/</g,'\\u003c');
  const html=PRISTINE.replace(/(<script id="baked" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+json+b);
  blobSave(`Commodity-Tracker-${iso(Date.now())}.html`, html, 'text/html'); saveLocal();
  toast('Dashboard file saved with your data — share that file.');
}

/* ---------- sections ---------- */
async function createSection(meta){
  const used=new Set(Object.values(custom).map(m=>m.color));
  const color=SWATCH.find(s=>!used.has(s)) || SWATCH[Object.keys(custom).length % SWATCH.length];
  const key='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const doc={name:String(meta.name||'Untitled').slice(0,60), unit:String(meta.unit||'').slice(0,30), cur:String(meta.cur||'').slice(0,4), dp:meta.dp, color, order:Date.now(), from:String(meta.from||'').slice(0,120)};
  custom[key]=doc; rebuildOrder();
  if(db) await db.collection('sections').doc(key).set(doc);
  return key;
}
async function removeSection(key){
  const n=await deleteManual([key]);
  if (C[key]&&C[key].custom){ delete custom[key]; if(db) await db.collection('sections').doc(key).delete(); }
  else { hiddenSections[key]=true; await saveSettings(); }
  if (state.key===key){ state.key=null; state.view=null; }
  rebuildOrder(); return n;
}

const parsePctIn = s => { s=String(s||'').trim(); if(!s) return null; const v=parseFloat(s.replace(/[^\d.\-+]/g,'')); return isFinite(v)? v/100 : NaN; };

function parseDate(s){ s=String(s).trim(); let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))) return mk(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))) return mk(m[3].length===2?2000+ +m[3]:+m[3],+m[2],+m[1]);
  const t=Date.parse(s+' UTC'); if(!isNaN(t)&&/[a-z]/i.test(s)&&/\d/.test(s)) return iso(t); return null;
  function mk(y,mo,d){ if(mo<1||mo>12||d<1||d>31) return null; return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`; } }
function splitLine(line){
  if (line.includes('\t')) return line.split('\t').map(c=>c.trim());
  if (line.includes(';')) return line.split(';').map(c=>c.trim());
  if (/^[^\s]+,[^\s]/.test(line.trim()) && !/\s/.test(line.trim())) return line.trim().split(',');
  const out=[]; for (const tok of line.trim().split(/\s+/)){ if(out.length && /^[¥$€£]$/.test(out[out.length-1])) out[out.length-1]+=tok; else out.push(tok); } return out;
}
// Reads: [S.No] Date Price [Day Week Month Year] — the layout of your sheet. Blank or #VALUE! % cells stay "calculate".
function parsePaste(txt){ const rows=[]; let pctSeen=false;
  for (const line of txt.split(/\r?\n/)){ if(!line.trim()) continue; const cells=splitLine(line);
    let di=-1; for(let i=0;i<cells.length;i++) if(parseDate(cells[i])){ di=i; break; } if(di<0) continue;
    let pi=-1,p=null; for(let i=di+1;i<cells.length;i++){ if(!cells[i]||/%/.test(cells[i])) continue; const v=parseNum(cells[i]); if(v!=null){ p=v; pi=i; break; } } if(p==null) continue;
    const ov={}; PCT.forEach((m,k)=>{ const c=cells[pi+1+k]; if(c&&/%/.test(c)){ const v=parsePctIn(c); if(isFinite(v)){ ov[m]=v; pctSeen=true; } } });
    rows.push({d:parseDate(cells[di]),p,ov}); }
  return {rows,pctSeen}; }
const pasteBox=document.getElementById('pasteBox'), pastePctWrap=document.getElementById('pastePctWrap'), pastePct=document.getElementById('pastePct');

/* ---------- Excel import: every sheet becomes a section ---------- */
let xlsxP=null;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxP) xlsxP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>res(window.XLSX); s.onerror=()=>{ xlsxP=null; rej(new Error('The Excel reader could not load. Check your connection and try again.')); }; document.head.appendChild(s); });
  return xlsxP; }
const CUR_SYM={USD:'$',CNY:'¥',RMB:'¥',JPY:'¥',EUR:'€',GBP:'£',INR:'₹',AUD:'A$',CAD:'C$',CHF:'CHF '};
function cellDate(XLSX,raw,fmt){
  if (typeof raw==='number' && raw>20000 && raw<80000){ const o=XLSX.SSF.parse_date_code(raw); if(o) return `${o.y}-${String(o.m).padStart(2,'0')}-${String(o.d).padStart(2,'0')}`; }
  return parseDate(String(fmt||raw||''));
}
function cellPct(raw,fmt){
  const s=String(fmt==null?'':fmt).trim(); if(!s || /#|n\/a|^-+$/i.test(s)) return null;
  if (typeof raw==='number') return /%/.test(s) ? raw : raw/100;   // Excel % cells hold fractions; plain numbers like 46.86 are percent points
  const v=parsePctIn(s); return Number.isFinite(v) ? v : null;
}
function parseSheet(XLSX,ws,sheet,file){
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
  const fmt=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:true});
  const txt=(i,j)=>String(((fmt[i]||[])[j])??'').trim();
  let h=-1; for(let i=0;i<Math.min(fmt.length,30);i++) if((fmt[i]||[]).some(c=>/^\s*(date|dates|trade date|as of)\s*$/i.test(String(c)))){ h=i; break; }
  const col={};
  const width=Math.max(0,...fmt.slice(0,60).map(r=>(r||[]).length));
  const head=j=> h<0 ? '' : (txt(h-1,j)+' '+txt(h,j)).trim();
  const dateLike=j=>{ let n=0; for(let i=h+1;i<Math.min(fmt.length,h+40);i++) if(cellDate(XLSX,(raw[i]||[])[j],txt(i,j))) n++; return n; };
  const numLike=j=>{ let n=0; for(let i=h+1;i<Math.min(fmt.length,h+40);i++){ const r=(raw[i]||[])[j], f=txt(i,j); if(/%/.test(f)) continue; if((typeof r==='number'&&!cellDate(XLSX,r,f))||parseNum(f)!=null&&!parseDate(f)) n++; } return n; };
  if (h>=0) col.date=(fmt[h]||[]).findIndex(c=>/^\s*(date|dates|trade date|as of)\s*$/i.test(String(c)));
  else { let best=0; for(let j=0;j<width;j++){ const n=dateLike(j); if(n>best){ best=n; col.date=j; } } if(best<2) return {sheet,file,rows:[],why:'no date column found'}; }
  for(let j=0;j<width;j++){ if(j===col.date) continue; const s=head(j).toLowerCase();
    if(col.price==null && /price|close|last|settle|value|\(.*\/.*\)|usd|cny|eur|inr/.test(s) && !/%|chg|change/.test(s)) col.price=j;
    else if(/\bday\b|daily|\b1d\b/.test(s)&&col.day==null) col.day=j; else if(/week|\b1w\b|\bwk/.test(s)&&col.week==null) col.week=j;
    else if(/month|\b1m\b|\bmth/.test(s)&&col.month==null) col.month=j; else if(/\byear|\b1y\b|yoy|\byr\b/.test(s)&&!/ytd/.test(s)&&col.year==null) col.year=j; }
  if (col.price==null){ let best=0; for(let j=col.date+1;j<width;j++){ const n=numLike(j); if(n>best){ best=n; col.price=j; } if(best>=3) break; } }
  if (col.price==null) return {sheet,file,rows:[],why:'no price column found'};
  const out=new Map(); let pct=false, sym='';
  for(let i=Math.max(h+1,0);i<raw.length;i++){ const rr=raw[i]||[];
    const d=cellDate(XLSX,rr[col.date],txt(i,col.date)); if(!d) continue;
    const pf=txt(i,col.price), p= typeof rr[col.price]==='number' ? rr[col.price] : parseNum(pf); if(p==null||!(p>0)) continue;
    if(!sym){ const m=pf.match(/[¥$€£₹]/); if(m) sym=m[0]; }
    const ov={}; for(const m of PCT){ if(col[m]==null) continue; const v=cellPct(rr[col[m]],txt(i,col[m])); if(v!=null){ ov[m]=v; pct=true; } }
    out.set(d,{d,p,ov}); }
  const rows=[...out.values()].sort((a,b)=>a.d<b.d?-1:1);
  let title=''; for(let i=0;i<Math.max(h,0)&&!title;i++) for(const c of (fmt[i]||[])){ const s=String(c).trim(); if(s.length>3&&!/^price$/i.test(s)){ title=s; break; } }
  let name=(title||sheet).split('|')[0].split(/[;,]?\s*source\s*:/i)[0].replace(/\bprices?\b/ig,'').replace(/\s{2,}/g,' ').replace(/[\s,;:|-]+$/,'').trim() || sheet;
  const ph=h>=0?head(col.price):''; const um=ph.match(/\(\s*([^)]+?)\s*\)/); const unit=um?um[1].replace(/\s*\/\s*/,' / '):'';
  const code=(unit.match(/^[A-Za-z]{3}/)||[''])[0].toUpperCase(); const cur=sym||CUR_SYM[code]||'';
  const med=rows.length?rows.map(r=>r.p).sort((a,b)=>a-b)[rows.length>>1]:0; const dp= med>=1000?0: med>=20?2:4;
  return {sheet,file,title,name,unit,cur,dp,rows,pct,why: rows.length?'':'no dated price rows found'};
}
const MATCH={copper:/copper/i,lithium:/lithium/i,wti:/\bwti\b|crude oil(?!.*brent)/i,brent:/brent/i};
function guessTarget(name){
  const n=name.toLowerCase().trim();
  for(const k of ORDER) if(C[k].custom && C[k].name.toLowerCase().trim()===n) return k;
  for(const k of BUILTIN) if(ORDER.includes(k) && MATCH[k].test(name)) return k;
  return 'new';
}
let impItems=[];
const imp=document.getElementById('imp'), fileIn=document.getElementById('fileIn');
function openPicker(){ fileIn.value=''; fileIn.click(); }
async function readFiles(files){
  imp.hidden=false; flash('impMsg','Reading…'); imp.scrollIntoView({block:'nearest'});
  try{ const XLSX=await loadXLSX();
    for (const f of files){ const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false});
      for (const sn of wb.SheetNames){ const it=parseSheet(XLSX,wb.Sheets[sn],sn,f.name); it.id=Math.random().toString(36).slice(2); it.on=it.rows.length>0; it.target=it.rows.length?guessTarget(it.name||sn):'new'; impItems.push(it); } }
    flash('impMsg', impItems.some(i=>i.on) ? 'Check each sheet, then import.' : 'No sheets with a Date and Price column were found.', !impItems.some(i=>i.on));
  }catch(err){ flash('impMsg',(err.message||'That file could not be read')+'.',true); }
  renderImp();
}
function renderImp(){
  const opts=it=>`<option value="new"${it.target==='new'?' selected':''}>New section</option>`+ORDER.map(k=>`<option value="${k}"${it.target===k?' selected':''}>${esc(C[k].short||C[k].name)}</option>`).join('');
  document.getElementById('impBody').innerHTML = impItems.length ? `<div class="imp-tbl"><table class="sheet"><thead><tr><th></th><th>Sheet</th><th>Section name</th><th>Import into</th><th>Unit</th><th>Rows</th></tr></thead><tbody>${
    impItems.map(it=>{ const dis=!it.rows.length, isNew=it.target==='new';
      return `<tr data-id="${it.id}" class="${dis?'off':''}"><td><input type="checkbox" data-f="on" aria-label="Import ${esc(it.sheet)}" ${it.on?'checked':''} ${dis?'disabled':''}></td>
        <td class="sh"><b>${esc(it.sheet)}</b><span>${esc(it.file)}</span></td>
        <td><input type="text" data-f="name" value="${esc(isNew?it.name||it.sheet:C[it.target].name)}" ${isNew&&!dis?'':'disabled'} aria-label="Section name"></td>
        <td><select data-f="target" ${dis?'disabled':''} aria-label="Import into">${opts(it)}</select></td>
        <td><input type="text" data-f="unit" class="u" value="${esc((isNew?it.unit:C[it.target].unit)||'')}" ${isNew&&!dis?'':'disabled'} placeholder="e.g. USD / lb" aria-label="Unit"></td>
        <td class="rc">${dis?`<span class="why">Skipped: ${esc(it.why)}</span>`:`${it.rows.length} <span>${esc(it.rows[0].d)} → ${esc(it.rows[it.rows.length-1].d)}${it.pct?' · with %':''}</span>`}</td></tr>`; }).join('')}</tbody></table></div>` : '';
  const n=impItems.filter(i=>i.on&&i.rows.length).length; const go=document.getElementById('impGo'); go.disabled=!n; go.textContent=n?`Import ${n} sheet${n>1?'s':''}`:'Import';
  document.getElementById('impPctWrap').hidden=!impItems.some(i=>i.pct);
}
document.getElementById('impBody').addEventListener('input',e=>{ const tr=e.target.closest('tr[data-id]'); if(!tr) return; const it=impItems.find(i=>i.id===tr.dataset.id), f=e.target.dataset.f;
  if(f==='on'){ it.on=e.target.checked; renderImp(); } else if(f==='target'){ it.target=e.target.value; renderImp(); } else if(f==='name') it.name=e.target.value; else if(f==='unit') it.unit=e.target.value; });
document.getElementById('impGo').addEventListener('click',async e=>{
  const go=e.currentTarget, keep=document.getElementById('impPct').checked, todo=impItems.filter(i=>i.on&&i.rows.length); if(!todo.length) return;
  go.disabled=true; let first=null, total=0;
  try{
    for (const [n,it] of todo.entries()){ flash('impMsg',`Importing ${n+1} of ${todo.length}: ${it.sheet}…`);
      const key = it.target==='new' ? await createSection({name:(it.name||it.sheet).trim(),unit:it.unit,cur:it.cur,dp:it.dp,from:`${it.file} › ${it.sheet}`}) : it.target;
      await saveRows(key, keep ? it.rows : it.rows.map(r=>({d:r.d,p:r.p,ov:{}}))); total+=it.rows.length; first=first||key; it.on=false; it.done=true; }
    impItems=impItems.filter(i=>!i.done&&i.rows.length); state.key=first; state.view=null; store.set('ct-key',first); rebuildOrder(); render();
    if(!impItems.length) imp.hidden=true;
    toast(`Imported ${total} rows from ${todo.length} sheet${todo.length>1?'s':''}.`);
  }catch(err){ flash('impMsg','Import stopped: '+(err.message||err.code||'storage unavailable')+'. Sheets already imported are kept.',true); rebuildOrder(); render(); renderImp(); }
});
document.getElementById('impMore').addEventListener('click',openPicker);
document.getElementById('impClose').addEventListener('click',()=>{ impItems=[]; imp.hidden=true; });
document.getElementById('bImport').addEventListener('click',openPicker);
fileIn.addEventListener('change',()=>{ if(fileIn.files.length) readFiles([...fileIn.files]); });
document.addEventListener('dragover',e=>{ if([...(e.dataTransfer?.types||[])].includes('Files')){ e.preventDefault(); document.body.classList.add('dropping'); } });
document.addEventListener('dragleave',e=>{ if(!e.relatedTarget) document.body.classList.remove('dropping'); });
document.addEventListener('drop',e=>{ if(!e.dataTransfer?.files?.length) return; e.preventDefault(); document.body.classList.remove('dropping');
  const fs=[...e.dataTransfer.files].filter(f=>/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)); if(fs.length) readFiles(fs); else toast('Drop an .xlsx, .xls or .csv file.'); });
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }

/* ---------- method panel ---------- */
function renderMethod(){
  document.querySelectorAll('#mMethod button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===calc.method)));
  document.getElementById('mFy').value=String(calc.fy);
  const fy = calc.fy===1 ? 'YTD = vs the last close of the previous calendar year.' : `FYTD = vs the last close before 1 ${MONTHS[calc.fy-1]} (start of the financial year).`;
  document.getElementById('mPop').innerHTML = calc.method==='calendar'
    ? `<b>% change = (Price today − Reference close) ÷ Reference close × 100.</b> Day: the previous trading session. Week: 7 calendar days earlier. Month: the same date one month earlier. Year: the same date one year earlier. If the reference date was a weekend or holiday, the last close before it is used (up to 4 / 7 / 12 days back for week / month / year); otherwise the cell shows —. ${fy}`
    : `<b>% change = (Price today − Reference close) ÷ Reference close × 100.</b> Day, Week, Month and Year use the close 1, 5, 21 and 252 <em>trading sessions</em> back, so holidays and weekends are skipped rather than counted. ${fy}`;
}
document.getElementById('mMethod').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; calc.method=b.dataset.m; store.set('ct-method',calc.method); render(); });
document.getElementById('mFy').addEventListener('change',e=>{ calc.fy=+e.target.value; store.set('ct-fy',calc.fy); render(); });
document.getElementById('mInfo').addEventListener('click',e=>{ const p=document.getElementById('mPop'); p.hidden=!p.hidden; e.currentTarget.setAttribute('aria-expanded',String(!p.hidden)); });
document.getElementById('mFy').innerHTML=MONTHS.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('');

/* ---------- boot ---------- */
function render(){ saveLocal(); renderMethod(); renderTiles(); renderRanges(); renderHead(); renderChart(); renderTable(); leave(); }
let rt; new ResizeObserver(()=>{ clearTimeout(rt); rt=setTimeout(renderChart,60); }).observe(document.getElementById('cwrap'));
document.getElementById('zFull').innerHTML=ICON.expand;
const booted={};
if (STANDALONE){
  let loc=null; try{ loc=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null'); }catch(e){}
  applyState(loc && loc.version===(BAKED.version||0) ? loc : BAKED);
  document.getElementById('bSaveFile').hidden=false; document.getElementById('bCsv').hidden=false;
  document.getElementById('bSaveFile').addEventListener('click',saveDashboardFile);
}
rebuildOrder();
render();

if (window.claude && window.claude.use){
  window.claude.use('downloads').then(d=>{ if(d){ downloads=d; document.getElementById('bCsv').hidden=false; } }).catch(()=>{});
  window.claude.use('db').then(d=>{ if(!d) return; db=d;
    db.doc('settings/view').onSnapshot(s=>{ const v=s.data(); if(!v) return;
      if(v.hideSeed&&typeof v.hideSeed==='object') hideSeed=Object.fromEntries(BUILTIN.map(k=>[k,!!v.hideSeed[k]]));
      if(v.hiddenSections&&typeof v.hiddenSections==='object') hiddenSections=Object.fromEntries(BUILTIN.filter(k=>v.hiddenSections[k]).map(k=>[k,true]));
      store.set('ct-hide',JSON.stringify(hideSeed)); store.set('ct-hidesec',JSON.stringify(hiddenSections)); rebuildOrder(); render(); }, ()=>{});
    db.collection('sections').onSnapshot(snap=>{ const m={}; for(const doc of snap.docs){ const v=doc.data(); if(v&&typeof v.name==='string') m[doc.id]=v; } custom=m;
      const want=(location.hash||'').slice(1); rebuildOrder(); if(m[want]&&!booted.hash){ booted.hash=true; state.key=want; } render(); }, ()=>{});
    db.collection('data').onSnapshot(snap=>{ const m={}; for(const doc of snap.docs){ const v=doc.data(); if(v&&v.key&&v.rows&&typeof v.rows==='object') m[doc.id]={key:v.key,year:String(v.year),rows:v.rows}; } chunkDocs=m; rebuildManual(); render(); }, ()=>{});
    db.collection('entries').onSnapshot(snap=>{ const m={}; for(const doc of snap.docs){ const v=doc.data(); if(!v||!v.key||!v.date||!(v.price>0)) continue; const ov={}; for(const k of PCT) if(typeof v[k]==='number'&&isFinite(v[k])) ov[k]=v[k]; (m[v.key]=m[v.key]||{})[v.date]={price:+v.price,ov,lid:doc.id}; } legacy=m; rebuildManual(); render(); }, ()=>{});
  }).catch(()=>{});
}
})();
</script>
